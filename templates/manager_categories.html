{% extends "base.html" %}
{% block content %}
<div class="manager-container" style="color: #dddddc; max-width: 600px; margin: 0 auto; padding: 20px;">
    <h2>Manage Expense Categories</h2>
    <hr style="border-color: #252A3D; margin-bottom: 20px;">

    <form method="POST" style="background: #1d004c; border: 1px solid #252A3D; padding: 20px; border-radius: 6px; display: flex; gap: 10px; margin-bottom: 30px;">
        <input type="text" name="category_name" placeholder="New Category Name" required
               style="flex: 1; padding: 10px; background: #181533; border: 1px solid #252A3D; border-radius: 4px; color: #ffffff;">
        <button type="submit" style="background: #7C6DF8; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer;">
            + Add
        </button>
    </form>

    <h3>Configured Active Categories</h3>
    <div style="background: #1d004c; border: 1px solid #252A3D; border-radius: 6px; overflow: hidden; margin-top: 15px;">
        {% for cat in categories %}
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid #252A3D;">
            <span style="font-weight: 500;">🔹 {{ cat.category_name }}</span>
            <form action="{{ url_for('remove_category', category_id=cat.category_id) }}" method="POST" onsubmit="return confirm('Are you sure you want to delete this category?');">
                <button type="submit" style="background: transparent; color: #FF5470; border: none; cursor: pointer; font-size: 0.9rem;">
                    Delete
                </button>
            </form>
        </div>
        {% else %}
        <div style="padding: 20px; text-align: center; color: #6B7089;">No categories initialized in the vault configuration system.</div>
        {% endfor %}
    </div>
</div>
{% endblock %}
